name: Update Royals data

on:
  schedule:
    # Runs every 15 minutes. GitHub may delay this a few minutes during busy
    # periods — that's normal for free scheduled workflows, not a bug.
    - cron: "*/15 * * * *"
  workflow_dispatch: {} # lets you also trigger it manually from the Actions tab

permissions:
  contents: write # needed so the workflow can commit the updated snapshot

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest MLB data
        run: node scripts/fetch-data.js

      - name: Commit updated snapshot (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json
          git diff --quiet --cached || git commit -m "Update Royals data snapshot"
          git push
